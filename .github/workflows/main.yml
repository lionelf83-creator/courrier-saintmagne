name: Compiler EXE Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install PyQt6==6.6.1
          pip install PyQt6-WebEngine==6.6.1
          pip install openpyxl
          pip install pyinstaller

      - name: Compiler l'exe
        run: pyinstaller courrier_v10.spec

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: Courrier_SaintMagne_EXE
          path: dist/Courrier_SaintMagne.exe
          retention-days: 30
