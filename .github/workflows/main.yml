name: Compiler EXE Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6==6.4.2
          pip install PyQt6-WebEngine==6.4.0
          pip install openpyxl==3.1.2
          pip install pyinstaller==5.13.2

      - name: Compiler l'exe
        run: |
          pyinstaller --onefile --noconsole --name Courrier_SaintMagne courrier_v10.py

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: Courrier_SaintMagne_EXE
          path: dist/Courrier_SaintMagne.exe
          retention-days: 30
